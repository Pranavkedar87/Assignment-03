
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Paint Application</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Simple Paint Application</h1>

    <div class="toolbar">
        <label for="color">Choose Color:</label>
        <input type="color" id="color" value="#000000">

        <label for="size">Brush Size:</label>
        <input type="range" id="size" min="1" max="30" value="5">
        <span id="sizeValue">5</span>

        <button onclick="clearCanvas()">Clear Canvas</button>
    </div>

    <canvas id="paint" width="800" height="450"></canvas>

</body>
</html>
